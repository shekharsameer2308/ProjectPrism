name: 'marketing_roi_engine'
version: '1.0.0'
config-version: 2

profile: 'marketing_roi_engine'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  lookback_days_click: 30
  lookback_hours_impression: 24
  half_life_days_time_decay: 7.0

models:
  marketing_roi_engine:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
