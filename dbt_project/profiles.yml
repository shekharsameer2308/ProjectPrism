marketing_roi_engine:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: '../data/analytics.duckdb'
      threads: 4

    bigquery:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_ID', 'globalretail-analytics-prod') }}"
      dataset: "{{ env_var('BQ_DEV_DATASET', 'analytics_dev') }}"
      threads: 8
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS', 'credentials/service-account.json') }}"
      location: "{{ env_var('GCP_REGION', 'us-central1') }}"
      timeout_seconds: 300
      priority: interactive
      retries: 1

    prod:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_ID', 'globalretail-analytics-prod') }}"
      dataset: "{{ env_var('BQ_MARTS_DATASET', 'marts') }}"
      threads: 8
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS', 'credentials/service-account.json') }}"
      location: "{{ env_var('GCP_REGION', 'us-central1') }}"
      timeout_seconds: 300
      priority: interactive
      retries: 2
